name: Release

# Fires on every push to master — i.e. every dev->master merge — and publishes a
# release: a CalVer version from today's date + existing tags, the NuGet package
# pushed to nuget.org via Trusted Publishing (OIDC, no stored key), and a GitHub
# Release (which creates the tag). Doc-only and CI-only merges are skipped
# (paths-ignore); to opt any other merge out, put "[skip release]" in the
# merge-commit message. workflow_dispatch stays for manual drafts / re-runs — a
# draft build packs and attaches the .nupkg but does not push to NuGet.
on:
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/**'
  workflow_dispatch:
    inputs:
      draft:
        description: "Draft: pack + attach the .nupkg, but don't push to NuGet"
        type: boolean
        default: false

# One release at a time; never cancel a run that may have already published.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write # OIDC token for NuGet Trusted Publishing (no stored API key)

jobs:
  release:
    runs-on: ubuntu-latest
    # push: skip when the merge commit opts out. dispatch: always run.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !contains(github.event.head_commit.message, '[skip release]')

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need all tags so the CalVer build segment is correct

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Compute version
        id: version
        shell: bash
        run: echo "value=$(bash scripts/compute-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Test
        shell: bash
        run: dotnet test ESI.NET.sln --configuration Release

      - name: Pack
        shell: bash
        run: >-
          dotnet pack ESI.NET/ESI.NET.csproj
          --configuration Release
          --output ./nupkgs
          -p:Version=${{ steps.version.outputs.value }}
          -p:ContinuousIntegrationBuild=true

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: nuget-package
          path: ./nupkgs/*.nupkg

      # Trusted Publishing: exchanges this job's GitHub OIDC token for a NuGet
      # API key valid ~1 hour. Requires a trusted-publishing policy on nuget.org
      # for seraphx2/ESI.NET -> release.yml. No secret is stored.
      - name: NuGet login (OIDC)
        id: nuget_login
        if: ${{ !inputs.draft }}
        uses: NuGet/login@v1
        with:
          user: robmburke

      - name: Push to NuGet.org
        if: ${{ !inputs.draft }}
        shell: bash
        run: >-
          dotnet nuget push "nupkgs/*.nupkg"
          --api-key ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Create GitHub Release
        id: gh_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.value }}
          name: ESI.NET ${{ steps.version.outputs.value }}
          draft: ${{ inputs.draft || false }}
          generate_release_notes: true
          files: ./nupkgs/*.nupkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Rich embed to the project Discord. Test webhook for manual dispatch runs,
      # the real one for a dev->master release. jq builds the payload so nothing
      # needs hand-escaping.
      - name: Announce on Discord
        if: ${{ success() && !inputs.draft }}
        shell: bash
        env:
          DISCORD_WEBHOOK: ${{ github.event_name == 'workflow_dispatch' && secrets.DISCORD_TEST_WEBHOOK_URL || secrets.DISCORD_WEBHOOK_URL }}
          VERSION: ${{ steps.version.outputs.value }}
          RELEASE_URL: ${{ steps.gh_release.outputs.url }}
        run: |
          jq -n --arg v "$VERSION" --arg url "$RELEASE_URL" '{
            embeds: [{
              title: ("ESI.NET " + $v + " Release"),
              url: $url,
              description: "The ESI.NET build completed successfully and the NuGet package has been published (indexing may take a few minutes). Click the title for the release changelog.",
              color: 3066993,
              author: { name: "Psianna Archeia" },
              fields: [{ name: "NuGet", value: ("https://www.nuget.org/packages/ESI.NET/" + $v) }]
            }]
          }' | curl -sS -f -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK"
